# Racetrack past the pillars world's pillars (sim/gazebo/make_pillars_world.py), for stereo depth tests.
# PX4 local frame (origin = spawn, x north, y east) [m]. Pillars: ENU (x, y) -> here (y, x).
planner:
  ros__parameters:
    # East 90 m south of the pillars, back west 130 m north of them: [x, y, heading_deg, ...]
    goals: [-90.0, 250.0, 90.0,  -90.0, 1100.0, 90.0,  130.0, 1100.0, 270.0,  130.0, 250.0, 270.0]
    obstacles: [0.0, 500.0, 12.0,  35.0, 650.0, 12.0,  -35.0, 650.0, 12.0,  0.0, 800.0, 12.0,  30.0, 950.0, 12.0]
    bounds: [-600.0, 600.0, -200.0, 1400.0]
    turn_radius: 40.0
    margin: 15.0
    altitude: 60.0
